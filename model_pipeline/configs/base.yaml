# Reusable training configuration. Paths resolve from the repository root; CLI overrides are optional.
paths:
  epw: epw/SWE_VG_Goteborg.City.AP.025120_TMYx.2011-2025.epw
  train_labels: data_output/train_set/label
  train_voxels: data_output/train_set/voxel
  val_labels: data_output/val_set/label
  val_voxels: data_output/val_set/voxel
training:
  amp: true
  epochs: 100
  batch_size: 32
  val_batch_size: 32
  lr: 0.0001
  lr_min_ratio: 0.01
  weight_decay: 0.0001
  grad_clip: 1.0
  patience: 50
  seed: 114514
  warmup_epochs: 5
data:
  segs: 2
  val_segs_divisor: 2
  val_min_segs: 2
  workers: 0
  min_seg_len: 72
  max_seg_len: 240
  cold_start_prob: 0.75
  val_cold_start_prob: 1.0
  max_zones: 10
  val_max_zones: 10
  zone_sample_seed: null
  val_zone_sample_seed: null
  val_fixed: false
  nb_k: 15
  nb_dropout_max: 5
  nb_dropout_min_valid: 1
voxel_features:
  use_element_onehot: false
loss:
  change_weight_alpha: 2.0
  change_weight_gamma: 2.0
  change_threshold_c: 0.5
  transition_loss_weight: 0.5
  transition_beta_c: 0.25
  focal_loss_weight: 0.25
  focal_threshold_c: 1.0
  focal_gamma: 2.0
  t0_loss_weight: 0.25
  crossing_loss_weight: 0.05
model:
  cnn_in_dim: 12
  cnn_out_dim: 256
  attn_heads: 8
  max_zone_queries: 256
  max_global_tokens: 4096
  spatial_bias_sigma: 20.0
  distance_bias_clip: 12.0
  distance_chunk_size: 64
  context_len: 72
  decoder_d_model: 128
  decoder_heads: 4
  decoder_layers: 4
  d_weather: 17
  nb_feat_dim: 4
  n_quantiles: 3
  quantiles: [0.1, 0.5, 0.9]
  dropout: 0.1
  tbptt_k: 72
  use_weather_delta: true
  weather_delta_indices: [0, 1, 2, 3, 4, 5]
  use_indoor_velocity: true
  neighbor_distance_sigma_m: 4.0
  neighbor_distance_bias_clip: 12.0
